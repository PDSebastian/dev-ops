server {
    listen 80;
    server_name cloud.IP_PUBLIC.nip.io;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /school-cloud { return 301 /school-cloud/; }
    location = /shop-cloud   { return 301 /shop-cloud/; }

    location /school-cloud/ {
        proxy_pass http://127.0.0.1:8120;
    }

    location /shop-cloud/ {
        proxy_pass http://127.0.0.1:8121;
    }

    location = / {
        default_type text/plain;
        return 200 "cloud apps\n\nschool: /school-cloud/swagger-ui.html\nshop:   /shop-cloud/swagger-ui.html\n";
    }
}
