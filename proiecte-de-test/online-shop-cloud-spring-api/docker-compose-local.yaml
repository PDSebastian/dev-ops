services:
  mysql-server:
    image: mysql:8.4
    container_name: mysql_server2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: default-online-shop_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  onlineshop-app:
    image: sebi123q/practice-onlineshop-api:v1
    container_name: online-shop-spring-api
    ports:
      - "8091:8082"
    environment:
      DB_URL: jdbc:mysql://mysql-server:3306/online_shop_spring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data: