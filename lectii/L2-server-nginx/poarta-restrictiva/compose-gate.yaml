name: gate

services:

  proxy:
    image: nginx:1.27-alpine
    container_name: gate-proxy
    volumes:
      - ./gate.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  api:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: gate-api
    restart: unless-stopped

  files:
    image: filebrowser/filebrowser:v2.31.2
    container_name: gate-files
    environment:
      FB_DATABASE: /database/filebrowser.db
      FB_ROOT: /srv
      FB_NOAUTH: "true"
      FB_BASEURL: /files
    volumes:
      - fb_data:/database
      - fb_files:/srv
    restart: unless-stopped

  static:
    image: mpepping/cyberchef:latest
    container_name: gate-static
    restart: unless-stopped

volumes:
  fb_data:
  fb_files:
