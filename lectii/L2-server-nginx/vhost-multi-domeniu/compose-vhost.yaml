services:

  proxy:
    image: nginx:1.27-alpine
    container_name: vhost-proxy
    volumes:
      - ./vhost.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  whoami:
    image: traefik/whoami:v1.10
    container_name: vhost-whoami
    restart: unless-stopped

  status:
    image: louislam/uptime-kuma:1
    container_name: vhost-status
    volumes:
      - kuma_data:/app/data
    restart: unless-stopped

  tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: vhost-tools
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.20
    container_name: vhost-mail
    restart: unless-stopped

  logs:
    image: amir20/dozzle:v8.5.4
    container_name: vhost-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  db-ui:
    image: adminer:4
    container_name: vhost-db-ui
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vhost-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  kuma_data:
  pg_data:
