services:
  whoami:
    image: traefik/whoami:v1.10
    container_name: vhost-whoami
    ports:
      - "127.0.0.1:8101:80"
    restart: unless-stopped

  status:
    image: louislam/uptime-kuma:1
    container_name: vhost-status
    ports:
      - "127.0.0.1:8102:3001"
    restart: unless-stopped

  tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: vhost-tools
    ports:
      - "127.0.0.1:8103:80"
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.20
    container_name: vhost-mail
    ports:
      - "127.0.0.1:8104:8025"
    restart: unless-stopped

  logs:
    image: amir20/dozzle:v8.5.4
    container_name: vhost-logs
    ports:
      - "127.0.0.1:8105:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vhost-postgres
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parolasigura123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  db-ui:
    image: adminer:4
    container_name: vhost-db-ui
    ports:
      - "127.0.0.1:8106:8080"
    restart: unless-stopped

volumes:
  kuma_data:
  pg_data: