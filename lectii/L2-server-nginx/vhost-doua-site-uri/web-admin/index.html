<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>admin.local</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; max-width: 760px; }
    h1 { color: #9b2c2c; }
    button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
    pre { background: #f4f4f5; padding: 14px; border-radius: 6px; white-space: pre-wrap; }
    b { color: #9b2c2c; }
  </style>
</head>
<body>
  <h1>admin.local</h1>
  <p>Site intern. Foloseste <b>acelasi</b> microserviciu ca magazinul, prin <b>acelasi</b> nginx.</p>
  <button>GET /api/</button>
  <pre id="raspuns">apasa butonul si uita-te la linia Host:</pre>
  <script>
    document.querySelector("button").addEventListener("click", function () {
      var box = document.getElementById("raspuns");
      box.textContent = "GET /api/ ...";
      fetch("/api/")
        .then(function (r) { return r.text().then(function (t) { return r.status + " " + r.statusText + "\n\n" + t; }); })
        .then(function (t) { box.textContent = t; })
        .catch(function (e) { box.textContent = "eroare de retea: " + e.message; });
    });
  </script>
</body>
</html>
