name: vhost

services:

  proxy:
    image: nginx:1.27-alpine
    container_name: vhost-proxy
    volumes:
      - ./conf:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    restart: unless-stopped

  web-magazin:
    image: nginx:1.27-alpine
    container_name: vhost-web-magazin
    volumes:
      - ./web-magazin:/usr/share/nginx/html:ro
    restart: unless-stopped

  web-admin:
    image: nginx:1.27-alpine
    container_name: vhost-web-admin
    volumes:
      - ./web-admin:/usr/share/nginx/html:ro
    restart: unless-stopped

  api:
    image: traefik/whoami:v1.10
    container_name: vhost-api
    restart: unless-stopped
