name: platforma

services:

  proxy:
    image: nginx:1.27-alpine
    container_name: platforma-proxy
    volumes:
      - ./conf:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: platforma-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped



  web-scoala:
    image: nginx:1.27-alpine
    container_name: platforma-web-scoala
    volumes:
      - ./web-scoala:/usr/share/nginx/html:ro
    restart: unless-stopped

  api-scoala:
    image: bogdandanielioan/online-school-cloud-api:1.0
    container_name: platforma-api-scoala
    environment:
      SERVER_PORT: 8081
      JPA_DDL_AUTO: update
      DB_URL: jdbc:mysql://mysql:3306/online_school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web-notite:
    image: nginx:1.27-alpine
    container_name: platforma-web-notite
    volumes:
      - ./web-notite:/usr/share/nginx/html:ro
    restart: unless-stopped

  api-notite:
    image: bogdandanielioan/notes-cloud-api:1.0.0
    container_name: platforma-api-notite
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web-masini:
    image: nginx:1.27-alpine
    container_name: platforma-web-masini
    volumes:
      - ./web-masini:/usr/share/nginx/html:ro
    restart: unless-stopped

  api-masini:
    image: bogdandanielioan/mock-car-source-api:release-20260702-052354
    container_name: platforma-api-masini
    restart: unless-stopped

volumes:
  mysql_data:
