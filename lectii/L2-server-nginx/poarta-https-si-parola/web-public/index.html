<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Zona publica</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; max-width: 760px; }
    h1 { color: #2b6cb0; }
    button { padding: 10px 16px; font-size: 15px; cursor: pointer; margin-right: 8px; }
    pre { background: #f4f4f5; padding: 14px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Zona publica</h1>
  <p>Intra oricine. Butonul al doilea cere zona protejata si trebuie sa dea 401 pana pui parola.</p>
  <button data-cale="/api/uuid">GET /api/uuid</button>
  <button data-cale="/admin/">GET /admin/</button>
  <pre id="raspuns">apasa un buton</pre>
  <script>
    document.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        var cale = b.dataset.cale;
        var box = document.getElementById("raspuns");
        box.textContent = "GET " + cale + " ...";
        fetch(cale, { redirect: "manual" })
          .then(function (r) { return r.text().then(function (t) { return r.status + " " + r.statusText + "\n\n" + t.slice(0, 400); }); })
          .then(function (t) { box.textContent = t; })
          .catch(function (e) { box.textContent = "eroare de retea: " + e.message; });
      });
    });
  </script>
</body>
</html>
