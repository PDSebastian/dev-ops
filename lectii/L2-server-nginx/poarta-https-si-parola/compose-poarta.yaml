name: poarta

services:

  proxy:
    image: nginx:1.27-alpine
    container_name: poarta-proxy
    volumes:
      - ./conf:/etc/nginx/conf.d:ro
      - ./secrete:/etc/nginx/secrete:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  web-public:
    image: nginx:1.27-alpine
    container_name: poarta-web-public
    volumes:
      - ./web-public:/usr/share/nginx/html:ro
    restart: unless-stopped

  web-admin:
    image: nginx:1.27-alpine
    container_name: poarta-web-admin
    volumes:
      - ./web-admin:/usr/share/nginx/html:ro
    restart: unless-stopped

  api:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: poarta-api
    restart: unless-stopped
