name: platforma

services:

  proxy:
    image: nginx:1.27-alpine
    container_name: platforma-proxy
    volumes:
      - ./conf:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    restart: unless-stopped

  web-magazin:
    image: nginx:1.27-alpine
    container_name: platforma-web-magazin
    volumes:
      - ./web-magazin:/usr/share/nginx/html:ro
    restart: unless-stopped

  web-admin:
    image: nginx:1.27-alpine
    container_name: platforma-web-admin
    volumes:
      - ./web-admin:/usr/share/nginx/html:ro
    restart: unless-stopped

  api-utilizatori:
    image: traefik/whoami:v1.10
    container_name: platforma-api-utilizatori
    restart: unless-stopped

  api-comenzi:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: platforma-api-comenzi
    restart: unless-stopped
