services:
  mysql:
    image: mysql:8.4
    container_name: mysql-shared
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_all_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  boats-users:
    image: sebi123q/boat-users-api:1.0
    container_name: boats-users
    ports:
      - "8091:8086"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/online_shop_spring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  solar-sync-app:
    image: sebi123q/solarsyncbroker-app:latest
    container_name: solar_sync_app
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/solarsyncbroker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:

    
      mysql:
        condition: service_healthy
    restart: unless-stopped

  car-app:
    image: sebi123q/car-app-api:1.0
    container_name: car-app-api
    ports:
      - "8087:8086"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cars_app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  sebi-onlineshop-app:
    image: sebi123q/sebi-online-schop-api:1.0
    container_name: sebi-online-shop-spring-api
    ports:
      - "8085:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/online_shop_spring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  sebionlineschool-app:
    image:  sebi123q/online-school-cloud-api:1.0
    container_name: online-school-spring-api
    ports:
      - "8084:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sebi_school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped        

volumes:
  mysql_all_data: