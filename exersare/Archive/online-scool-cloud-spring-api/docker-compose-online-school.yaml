version: '3.8'

services:
   mysql-school-app:
    image: mysql:8.4
    container_name: school-app_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school-app_db
    ports:
      - "3312:3306"
    volumes:
      - school-app_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
   school-app:
     image: sebi123q/school-app-api:0.0.1
     container_name: school-app
     ports:
       - "8082:8080"
     environment:
       SERVER_PORT: "8080"
       SPRING_DATASOURCE_URL: jdbc:mysql://mysql-school-app:3306/school-app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
       SPRING_DATASOURCE_USERNAME: root
       SPRING_DATASOURCE_PASSWORD: root
       SPRING_JPA_SHOW_SQL: "true"
     depends_on:
       mysql-school-app:
         condition: service_healthy
     restart: unless-stopped


volumes:
  school-app_data: