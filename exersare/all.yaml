services:
  mysql:
    image: mysql:8.4
    container_name: mysql-shared
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_all_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  boats-users:
    image: sebi123q/boats-users-app:1.0
    container_name: boats-users
    ports:
      - "8091:8087"
    environment:
      SERVER_PORT: "8087"
      DB_URL: jdbc:mysql://mysql:3306/boats_users_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  solarsyncbroker-app:
    image: sebi123q/solarsyncbroker-app:2.0
    container_name: solarsyncbroker-app
    ports:
      - "8092:8090"
    environment:
      SERVER_PORT: "8090"
      DB_URL: jdbc:mysql://mysql:3306/solarsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped   

  sebi-online-shop-app:
    image: sebi123q/sebi-online-shop-app:1.0
    container_name: sebi-online-shop-app
    ports:
      - "8093:8089"
    environment:
      SERVER_PORT: "8089"
      DB_URL: jdbc:mysql://mysql:3306/online_shop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped  

  school-app:
     image: sebi123q/school-app-api:0.0.1
     container_name: school
     ports:
       - "8094:8080"
     environment:
       SERVER_PORT: "8080"
       SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/school-app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
       SPRING_DATASOURCE_USERNAME: root
       SPRING_DATASOURCE_PASSWORD: root
       SPRING_JPA_SHOW_SQL: "true"
     depends_on:
       mysql:
         condition: service_healthy
     restart: unless-stopped

  sebi-school-app:
    image: sebi123q/sebi-school-app:1.0
    container_name: sebi-school-app
    ports:
      - "8095:8088"
    environment:
      SERVER_PORT: "8088"
      DB_URL: jdbc:mysql://mysql:3306/sebi_school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      JPA_SHOW_SQL: "true"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped


volumes:
  mysql_all_data: